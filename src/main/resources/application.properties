# ── Server ────────────────────────────────────────────────────────────────────
server.port=8080

# ── Dashboard data directory ──────────────────────────────────────────────────
# Path to the directory containing node_registry_summary.json and the per-node
# subdirectories. Override per environment:
#
#   Local (running from project root via mvn spring-boot:run):
#     dashboard.data-dir=src/main/dashboard/data
#
#   Cloud / container (data mounted as a volume):
#     dashboard.data-dir=/data/dashboard
#
#   Override via environment variable (takes precedence):
#     export DASHBOARD_DATA_DIR=/data/dashboard
#
dashboard.data-dir=dashboard/data
check.node-name      = DEFAULT
check.api-key-node   = RO9Ze9oy4lWuuJsimeii1JvDZZInBmlW

# ── Check All scheduling ────────────────────────────────────────────────────────
# Runs CheckNodeCapabilities once, then Exchange Services, Service Monitoring
# and Federated Search for every registered Node in turn — the same job the
# "Check All" button in the Run checks menu triggers. See CheckAllScheduler.
#
#   check.check-all.scheduled.enabled = true to turn the scheduled run on;
#   defaults to false (Check All then only runs when triggered by hand).
#
#   check.check-all.scheduled.cron uses Spring's 6-field cron syntax
#   (second minute hour day-of-month month day-of-week). Only takes effect
#   while enabled=true. Examples:
#     0 0 3 * * *     daily at 03:00
#     0 0 3 * * MON   weekly, Monday at 03:00
#     0 0 */6 * * *   every 6 hours
#
check.check-all.scheduled.enabled = false
check.check-all.scheduled.cron    = 0 0 3 * * *

# ── Logging ───────────────────────────────────────────────────────────────────
logging.level.eu.cessda.pilotnode=INFO